name: Publish OG artwork
on:
  push:
    branches: [main]
    paths:
      - scripts/generate-og.py
      - .github/workflows/generate-og.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  artwork:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raster renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          python -m pip install Pillow==11.3.0
      - name: Generate five 1200x630 social cards
        run: python scripts/generate-og.py
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Publish five coordinated Open Graph card images"
            git push
          fi
