name: Site quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit static site
        run: node scripts/check-site.mjs
